name: ci
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 25
            os: ubuntu-latest
          - java: 17
            os: ubuntu-latest
          - java: 17
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: ${{matrix.java}}
        distribution: zulu
    - uses: actions/checkout@v7.0.1
    - run: gh extension install github/gh-actions-lock
    - run: gh actions-lock --verify
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: sbt/setup-sbt@v1.5.15
    - if: matrix.os != 'windows-latest'
      run: sbt -v --server scalafmtSbtCheck "+ scalafmtCheckAll"
    - shell: bash
      run: sbt -v --server "+ testFull" "+ publishLocal"
    - shell: bash
      run: rm -rf "$HOME/.ivy2/local" || true
