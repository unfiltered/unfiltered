name: ci
on:
  push:
  pull_request:
  schedule:
  - cron: '0 3 * * *'
jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 17
            os: ubuntu-latest
          - java: 11
            os: ubuntu-latest
          - java: 11
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-java@v6
      with:
        java-version: ${{matrix.java}}
        distribution: temurin
    - uses: actions/checkout@v7
    - uses: sbt/setup-sbt@v1
    - shell: bash
      run: sbt -v "+ mimaReportBinaryIssues" "+ test" "+ publishLocal"
    - shell: bash
      run: rm -rf "$HOME/.ivy2/local" || true
